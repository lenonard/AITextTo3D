name: Learned Depth SDF to STL

on:
  push:
    paths:
      - 'scripts/depth_sdf_reconstruct.py'
      - 'scripts/run_depth_sdf.py'
      - 'datasets_depth/**'
      - '.github/workflows/depth-sdf-to-stl.yml'
  workflow_dispatch:
    inputs:
      dataset_root:
        description: 'Dataset folder under repository root'
        required: true
        default: 'datasets_depth/cat_sitting_v1'

jobs:
  reconstruct:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TRANSFORMERS_NO_ADVISORY_WARNINGS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: depth-anything-v2-small-hf-v1
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'transformers>=4.45,<5' pillow scipy scikit-image trimesh safetensors huggingface_hub
      - name: Reconstruct learned-depth SDF mesh
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ github.event.inputs.dataset_root }}"
          if [[ -z "$ROOT" ]]; then ROOT='datasets_depth/cat_sitting_v1'; fi
          mkdir -p output/depth_sdf_diagnostics
          python scripts/run_depth_sdf.py "$ROOT" \
            -o output/cat_sitting_depth_sdf_v3.stl \
            --diagnostics output/depth_sdf_diagnostics \
            --resolution 144 152 208
      - name: Fix STL winding and validate solid
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          p=Path('output/cat_sitting_depth_sdf_v3.stl')
          m=trimesh.load(p, force='mesh')
          if m.volume < 0:
              m.invert()
              m.export(p)
          report_path=p.with_suffix('.build.json')
          report=json.loads(report_path.read_text())
          report['signed_volume_after_winding_fix']=float(m.volume)
          report['watertight_after_winding_fix']=bool(m.is_watertight)
          report['is_volume_after_winding_fix']=bool(m.is_volume)
          report_path.write_text(json.dumps(report,indent=2))
          assert m.is_watertight, 'final STL is not watertight'
          assert m.is_volume, 'final STL is not a consistently oriented solid'
          print(json.dumps(report,indent=2))
          PY
      - name: List outputs
        run: find output -maxdepth 2 -type f -printf '%p %k KB\n' | sort
      - name: Upload reconstruction artifact
        uses: actions/upload-artifact@v4
        with:
          name: aitextto3d-depth-sdf-v3
          path: output/
          if-no-files-found: error
          retention-days: 14
